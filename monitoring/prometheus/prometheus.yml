# Prometheus for the SiteSentinel stack (baked into sitesentinel-prometheus).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert-rules.yml

scrape_configs:
  # The backend exposes its counters, gauges and histograms at /metrics.
  - job_name: sitesentinel
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
