name: SiteSentinel CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly retrain + redeploy, Mondays 03:30 UTC.
    - cron: "30 3 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: sitesentinel-backend
  PYTHON_VERSION: "3.12"
  PROMETHEUS_IMAGE: prom/prometheus:v3.13.3
  KIND_VERSION: v0.32.0
  # Kubernetes 1.34 node: unlike the 1.35+ default it also runs on cgroup v1 hosts (Docker Desktop
  # on WSL2), so CI and the team's laptops use the same cluster version.
  KIND_NODE_IMAGE: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256

jobs:
  lint-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt pytest-cov

      - name: Lint (flake8)
        run: (cd backend && flake8 .)

      - name: Unit tests (pytest + coverage)
        run: (cd backend && pytest --junitxml=../reports/backend-junit.xml --cov=. --cov-report=term --cov-report=xml:../reports/coverage.xml)

      - name: Validate Prometheus config and alert rules (promtool)
        run: |
          promtool() {
            docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" -w /etc/prometheus \
              --entrypoint promtool "$PROMETHEUS_IMAGE" "$@"
          }
          promtool check config /etc/prometheus/prometheus.yml
          promtool check rules /etc/prometheus/alert-rules.yml
          promtool test rules /etc/prometheus/alert-rules.test.yml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore

  train-model:
    name: Train & Validate Model
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ml/requirements.txt pytest flake8

      - name: Lint & test ML code
        run: (cd ml && flake8 . && pytest)

      - name: Train model and apply quality gate
        run: >-
          python ml/train.py
          --out backend/model/ppe_model.json
          --report ml/reports/metrics.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload model artifact
        uses: actions/upload-artifact@v6
        with:
          name: ppe-model
          path: |
            backend/model/ppe_model.json
            ml/reports/metrics.json
          if-no-files-found: error

  build-push:
    name: Build, Scan & Push Image
    needs: train-model
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Download trained model
        uses: actions/download-artifact@v6
        with:
          name: ppe-model
          path: .

      - name: Compute image name and tag
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="sha-${GITHUB_SHA::7}"
          echo "image=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Image: ghcr.io/${owner}/${IMAGE_NAME}:${tag}"

      - name: Build image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          tags=(-t "$IMAGE:$TAG" -t "$IMAGE_NAME:ci")
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags+=(-t "$IMAGE:latest")
          fi
          docker build --build-arg APP_VERSION="$TAG" "${tags[@]}" backend
          docker image ls "$IMAGE"

      - name: Scan dependencies for known vulnerabilities (pip-audit, report only)
        continue-on-error: true
        run: pipx run --spec pip-audit==2.7.3 pip-audit -r backend/requirements.txt

      - name: Smoke test the container
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker run -d --name sitesentinel-smoke -p 8080:8080 "$IMAGE_NAME:ci"
          bash scripts/smoke-test.sh http://localhost:8080 "$TAG"

      - name: Container logs
        if: always()
        run: |
          docker logs sitesentinel-smoke 2>&1 | tail -n 50 || true
          docker rm -f sitesentinel-smoke || true

      - name: Push to GitHub Container Registry
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker push "$IMAGE:$TAG"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker push "$IMAGE:latest"
          fi

      - name: Save image for the deploy job
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: docker save "$IMAGE:$TAG" | gzip > sitesentinel-backend.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v6
        with:
          name: backend-image
          path: sitesentinel-backend.tar.gz
          retention-days: 3
          if-no-files-found: error

      - name: Job summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          model_version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' backend/model/ppe_model.json | head -n 1)
          if [ "$EVENT" = "pull_request" ]; then pushed="no (pull request)"; else pushed="yes"; fi
          {
            echo "### Backend image"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE:$TAG\` |"
            echo "| App version | \`$TAG\` |"
            echo "| Model version | \`${model_version:-unknown}\` |"
            echo "| Pushed to GHCR | $pushed |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy to Staging (Kubernetes)
    needs: build-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      IMAGE_REF: ${{ needs.build-push.outputs.image }}:${{ needs.build-push.outputs.tag }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Download image artifact
        uses: actions/download-artifact@v6
        with:
          name: backend-image
          path: .

      - name: Load image
        run: gunzip -c sitesentinel-backend.tar.gz | docker load

      - name: Install kind
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version
          kubectl version --client

      - name: Create Kubernetes cluster (kind)
        run: kind create cluster --name sitesentinel --image "$KIND_NODE_IMAGE" --wait 120s

      - name: Load image into the cluster
        run: kind load docker-image "$IMAGE_REF" --name sitesentinel

      - name: Deploy, smoke test, roll back on failure
        run: bash scripts/k8s-deploy.sh "$IMAGE_REF"

      - name: Show deployment
        run: |
          kubectl get all -n sitesentinel
          kubectl rollout history deployment/sitesentinel-backend -n sitesentinel
          kubectl logs -n sitesentinel deployment/sitesentinel-backend --tail=20
          kubectl logs -n sitesentinel deployment/sitesentinel-simulator --tail=20

      - name: Debug failed deployment
        if: failure()
        run: |
          kubectl get all -n sitesentinel || true
          kubectl describe pods -n sitesentinel || true
          kubectl get events -n sitesentinel --sort-by=.lastTimestamp || true
          kubectl logs -n sitesentinel deployment/sitesentinel-backend --tail=100 || true
          kubectl logs -n sitesentinel deployment/sitesentinel-simulator --tail=50 || true

      - name: Job summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "### Staging deployment (kind)"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE_REF\` |"
            echo "| Result | $OUTCOME |"
            echo ""
            echo '```'
            kubectl get deployments,pods,services -n sitesentinel 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
