# SiteSentinel backend (Flask + gunicorn). __IMAGE__ is replaced by scripts/k8s-deploy.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sitesentinel-backend
  namespace: sitesentinel
  labels:
    app.kubernetes.io/name: sitesentinel
    app.kubernetes.io/component: backend
  annotations:
    kubernetes.io/change-cause: "deploy __IMAGE__"
spec:
  # One replica: the event store lives in memory.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sitesentinel
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sitesentinel
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PROVIDER
              value: console
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: sitesentinel-backend
  namespace: sitesentinel
  labels:
    app.kubernetes.io/name: sitesentinel
    app.kubernetes.io/component: backend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: sitesentinel
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
