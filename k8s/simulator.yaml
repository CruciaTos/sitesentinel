# Camera simulator: posts synthetic frames to the backend. Same image as the backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sitesentinel-simulator
  namespace: sitesentinel
  labels:
    app.kubernetes.io/name: sitesentinel
    app.kubernetes.io/component: simulator
  annotations:
    kubernetes.io/change-cause: "deploy __IMAGE__"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: sitesentinel
      app.kubernetes.io/component: simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sitesentinel
        app.kubernetes.io/component: simulator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: simulator
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["python", "simulator.py"]
          env:
            - name: BACKEND_URL
              value: http://sitesentinel-backend:8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
